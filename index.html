<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b12"><title>Million Clicks Premium</title>
<style>
:root{--bg:#090b12;--panel:#151a27;--line:#30364b;--gold:#f4c66a;--purple:#9274ff;--text:#f5f6fb;--muted:#a0a8bc}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at top,#20213b,#090b12 65%);color:var(--text);font-family:system-ui,Arial,sans-serif}.app{max-width:650px;margin:auto;padding:15px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{font-weight:900;letter-spacing:1px}.logo{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:8px;border-radius:12px;background:linear-gradient(135deg,#ffe5a0,#bd812e);color:#17120a;font-size:22px}.pill,.stat,.zone,.item{background:var(--panel);border:1px solid var(--line);border-radius:15px}.pill{padding:8px;color:var(--gold);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat{padding:12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat strong{display:block;font-size:clamp(18px,5vw,25px);margin-top:5px;overflow-wrap:anywhere}.gold{color:var(--gold)}.zone{text-align:center;padding:18px 12px;background:linear-gradient(145deg,#191e2e,#10131d)}.small{font-size:11px;color:var(--muted)}.tap{width:min(58vw,210px);height:min(58vw,210px);border-radius:50%;border:6px solid #ffe6a155;background:radial-gradient(circle at 30% 25%,#fff1bf,#f0c15e 35%,#a76c29 78%);color:#211708;font-weight:900;box-shadow:0 0 0 8px #d8a54e12,0 9px 0 #5b3a20;touch-action:manipulation;margin:17px auto;display:block}.tap:active{transform:translateY(4px);box-shadow:0 5px 0 #5b3a20}.star{display:block;font-size:42px}.tap b{font-size:21px;letter-spacing:3px}.progress{height:6px;background:#30364b;border-radius:20px;overflow:hidden;margin-top:11px}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));width:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:13px 0}.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:11px 2px;font-size:12px;font-weight:bold}.tab.active{background:linear-gradient(135deg,#8064ee,#5c48bb)}h2{font-size:17px;margin:18px 2px 5px}.desc{font-size:12px;color:var(--muted);margin:0 2px 10px}.item{padding:11px;display:flex;align-items:center;gap:9px;margin:8px 0}.emoji{font-size:25px;width:36px;text-align:center}.info{flex:1;min-width:0}.info b{font-size:13px}.info p{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.35}.buy{background:linear-gradient(135deg,#f3cc79,#c18a3b);border:0;border-radius:9px;padding:10px 7px;color:#211708;font-size:11px;font-weight:900;max-width:130px}.buy:disabled{opacity:.4}footer{text-align:center;color:#657087;font-size:10px;padding:18px}.notice{position:fixed;bottom:20px;left:5%;width:90%;text-align:center;background:#272d42;border:1px solid #49516b;border-radius:12px;padding:12px;display:none;z-index:5}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><span class="logo">M</span>MILLION CLICKS</div><div class="pill" id="level">NÍVEL 1</div></header>
<div class="stats"><div class="stat"><small>✦ Cliques</small><strong class="gold" id="clicks">0</strong></div><div class="stat"><small>◈ Moedas</small><strong id="coins">0</strong></div><div class="stat"><small>♜ Renascimentos</small><strong id="rebirths">0</strong></div><div class="stat"><small>⚡ Por toque</small><strong id="power">1</strong></div></div>
<section class="zone"><div class="small">CADA TOQUE APROXIMA VOCÊ DO TOPO</div><p class="gold" id="goal">Meta: 1.000.000 cliques</p><button class="tap" id="tap"><span class="star">✦</span><b>TOCAR</b><br><small>+<span id="tapPower">1</span> POR TOQUE</small></button><div class="small">Progresso: <b id="percent">0%</b></div><div class="progress"><div id="bar"></div></div></section>
<nav class="tabs"><button class="tab active" data-tab="home">🏆 Início</button><button class="tab" data-tab="upgrades">⚒️ Melhorias</button><button class="tab" data-tab="pets">🐾 Pets</button><button class="tab" data-tab="worlds">🌌 Mundos</button></nav><main id="panel"></main><footer>PROGRESSO SALVO NESTE DISPOSITIVO · VERSÃO LEVE</footer></div><div class="notice" id="notice"></div>
<script>
"use strict";const $=id=>document.getElementById(id),MAX=1e300,GOAL=1e6;
const upgrades=[{id:"finger",name:"Dedos treinados",icon:"👆",desc:"+1 poder por nível",base:25,power:1,max:100},{id:"strong",name:"Clique forte",icon:"🥊",desc:"+5 poder por nível",base:250,power:5,max:100},{id:"turbo",name:"Clique turbo",icon:"⚡",desc:"+25 poder por nível",base:2500,power:25,max:100},{id:"cosmic",name:"Clique cósmico",icon:"🌠",desc:"+125 poder por nível",base:25000,power:125,max:100},{id:"quantum",name:"Núcleo quântico",icon:"💎",desc:"+600 poder por nível",base:250000,power:600,max:100}];
const pets=[{id:"cat",name:"Gatinho lunar",icon:"🐈‍⬛",cost:500,mult:1.5,rarity:"COMUM"},{id:"dog",name:"Cachorro guardião",icon:"🐕",cost:2500,mult:2,rarity:"RARO"},{id:"dragon",name:"Dragão astral",icon:"🐉",cost:15000,mult:3.5,rarity:"ÉPICO"},{id:"phoenix",name:"Fênix dourada",icon:"🦅",cost:100000,mult:6,rarity:"LENDÁRIO"},{id:"void",name:"Mascote do vazio",icon:"👾",cost:750000,mult:12,rarity:"MÍTICO"}];
const worlds=[{id:"meadow",name:"Jardim Obsidiano",icon:"🌿",cost:0,mult:1},{id:"desert",name:"Dunas Douradas",icon:"🏜️",cost:5000,mult:2},{id:"ice",name:"Cidadela de Gelo",icon:"❄️",cost:50000,mult:5},{id:"space",name:"Galáxia Sombria",icon:"🌌",cost:500000,mult:12},{id:"void",name:"Dimensão do Vazio",icon:"🪐",cost:5000000,mult:30}];
const fresh=()=>({clicks:0,coins:0,rebirths:0,total:0,upgrades:{},pets:{},equipped:"",worlds:{meadow:true},world:"meadow",missions:{},lastDaily:"",streak:0});let d=fresh(),tab="home",dirty=false,saveTimer,toastTimer;
try{const s=JSON.parse(localStorage.getItem("millionClicksPremium"));if(s&&typeof s==="object")d={...fresh(),...s,upgrades:s.upgrades||{},pets:s.pets||{},worlds:{meadow:true,...(s.worlds||{})},missions:s.missions||{}}}catch(e){}
function safe(n){return Math.min(MAX,Math.max(0,Number.isFinite(n)?n:MAX))}function add(a,b){return safe(safe(a)+safe(b))}
function fmt(n){n=safe(n);if(n<1e6)return Math.floor(n).toLocaleString("pt-BR");if(n<1e15)return n.toLocaleString("pt-BR",{maximumFractionDigits:1});return n.toExponential(2).replace(".",",")}
function power(){let b=1;for(const u of upgrades)b+=Math.min(100,d.upgrades[u.id]||0)*u.power;const pet=pets.find(x=>x.id===d.equipped),w=worlds.find(x=>x.id===d.world)||worlds[0];return safe(Math.floor(b*(pet?pet.mult:1)*w.mult*(1+d.rebirths*.5)))}
function cost(u){return safe(Math.floor(u.base*Math.pow(1.38,Math.min(100,d.upgrades[u.id]||0))))}function rebirthCost(){return safe(100000*(d.rebirths+1))}
function save(){try{localStorage.setItem("millionClicksPremium",JSON.stringify(d));dirty=false}catch(e){}}function scheduleSave(){dirty=true;if(!saveTimer)saveTimer=setTimeout(()=>{saveTimer=null;if(dirty)save()},2500)}
function toast(t){$("notice").textContent=t;$("notice").style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("notice").style.display="none",2000)}
function stats(){let p=power();$("clicks").textContent=fmt(d.clicks);$("coins").textContent=fmt(d.coins);$("rebirths").textContent=fmt(d.rebirths);$("power").textContent=fmt(p);$("tapPower").textContent=fmt(p);$("level").textContent="NÍVEL "+(1+Math.floor(Math.sqrt(Math.min(d.total,1e12)/100)));let pc=Math.min(100,d.clicks/GOAL*100);$("percent").textContent=pc.toFixed(1).replace(".",",")+"%";$("bar").style.width=pc+"%";$("goal").textContent=d.clicks>=GOAL?"Meta alcançada! Continue crescendo":"Meta: 1.000.000 cliques"}
function item(icon,title,desc,text,disabled,fn,tag=""){let el=document.createElement("div");el.className="item";let i=document.createElement("div");i.className="emoji";i.textContent=icon;let info=document.createElement("div");info.className="info";let b=document.createElement("b");b.textContent=title+(tag?" · "+tag:"");let p=document.createElement("p");p.textContent=desc;info.append(b,p);el.append(i,info);if(text){let btn=document.createElement("button");btn.className="buy";btn.textContent=text;btn.disabled=!!disabled;btn.addEventListener("click",fn);el.append(btn)}return el}
function heading(t,desc){let h=document.createElement("h2");h.textContent=t;let p=document.createElement("p");p.className="desc";p.textContent=desc;return[h,p]}
function panel(){let p=$("panel");p.replaceChildren();if(tab==="home"){p.append(...heading("Sua jornada","Pequenos toques. Poder extraordinário."));let today=new Date().toDateString(),daily=d.lastDaily===today;p.append(item("🎁","Recompensa diária","Receba moedas grátis uma vez por dia.",daily?"Resgatado":"Resgatar "+fmt(250+d.streak*100),daily,()=>{d.coins=add(d.coins,250+d.streak*100);d.streak++;d.lastDaily=today;toast("Recompensa recebida!");stats();panel();scheduleSave()}));p.append(...heading("Missões","Complete objetivos para ganhar moedas."));[{id:"m100",name:"Primeiros passos",goal:100,reward:100},{id:"m1000",name:"Cliqueiro dedicado",goal:1000,reward:500},{id:"m10000",name:"Lenda do toque",goal:10000,reward:2500}].forEach(m=>{let done=!!d.missions[m.id];p.append(item(done?"✅":"🎯",m.name,"Progresso: "+fmt(Math.min(d.total,m.goal))+"/"+fmt(m.goal),done?"Concluída":"Receber "+fmt(m.reward),done||d.total<m.goal,()=>{d.missions[m.id]=true;d.coins=add(d.coins,m.reward);toast("Missão concluída!");stats();panel();scheduleSave()}))});let rc=rebirthCost();p.append(...heading("Renascimento","Recomece para ganhar poder permanente."));p.append(item("♻️","Renascimento #"+(d.rebirths+1),"Precisa de "+fmt(rc)+" cliques. Mantém pets e mundos; ganha +50% de poder.","Ren nascer · "+fmt(rc),d.clicks<rc,()=>{if(d.clicks<rc)return;d.rebirths++;d.clicks=0;d.coins=0;d.upgrades={};d.world="meadow";toast("Renascimento concluído!");stats();panel();scheduleSave()}))}
else if(tab==="upgrades"){p.append(...heading("Melhorias","Aumente o poder de cada toque."));upgrades.forEach(u=>{let lv=d.upgrades[u.id]||0,c=cost(u);p.append(item(u.icon,u.name+" · nível "+lv+"/100",u.desc,"Comprar · "+fmt(c),lv>=u.max||d.coins<c,()=>{d.coins-=c;d.upgrades[u.id]=lv+1;stats();panel();scheduleSave();toast("Melhoria comprada!")}))})}
else if(tab==="pets"){p.append(...heading("Coleção de pets","Equipe um companheiro para multiplicar seus ganhos."));p.append(item("🚫","Sem pet","Multiplicador x1",d.equipped?"Desequipar":"Equipado",!d.equipped,()=>{d.equipped="";stats();panel();scheduleSave()}));pets.forEach(x=>{let owned=!!d.pets[x.id],eq=d.equipped===x.id;p.append(item(x.icon,x.name,"Multiplicador x"+x.mult,owned?(eq?"Equipado":"Equipar"):"Comprar · "+fmt(x.cost),eq||(!owned&&d.coins<x.cost),()=>{if(!owned){d.coins-=x.cost;d.pets[x.id]=true}d.equipped=x.id;stats();panel();scheduleSave();toast("Pet equipado!")},x.rarity))})}
else{p.append(...heading("Mundos","Desbloqueie dimensões com multiplicadores maiores."));worlds.forEach(w=>{let owned=!!d.worlds[w.id],cur=d.world===w.id;p.append(item(w.icon,w.name,"Multiplicador x"+w.mult,owned?(cur?"Mundo atual":"Viajar"):"Desbloquear · "+fmt(w.cost),cur||(!owned&&d.coins<w.cost),()=>{if(!owned){d.coins-=w.cost;d.worlds[w.id]=true}d.world=w.id;stats();panel();scheduleSave();toast("Bem-vindo a "+w.name+"!")},owned?"LIBERADO":"NOVO"))})}}
function tap(e){let g=power();d.clicks=add(d.clicks,g);d.coins=add(d.coins,g);d.total=add(d.total,g);stats();scheduleSave();if(d.total>=GOAL&&!d.missions.million){d.missions.million=true;toast("🏆 Um milhão de cliques!")}}
$("tap").addEventListener("pointerdown",e=>{e.preventDefault();tap(e);if(navigator.vibrate)navigator.vibrate(5)});document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));panel();window.scrollTo(0,0)}));stats();panel();setInterval(()=>{if(dirty)save()},10000);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});window.addEventListener("pagehide",save);
</script></body></html>
